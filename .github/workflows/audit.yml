name: Dependency audit

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      # Toolchain vulnerabilities can compromise CI and deployments even when
      # the affected package is not bundled into the Worker.
      - run: npm audit --audit-level=high
